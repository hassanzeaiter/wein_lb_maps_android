name: Build APK

# Build only on the long-lived branches, and on PRs targeting them.
# Feature branches don't build on push — they get verified through their PR.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # On pull_request, github.ref_name is "<pr>/merge" — the slash is illegal in an
      # artifact name. Use the PR's source branch on PRs, the branch on push, and strip
      # any remaining slashes (e.g. feature/x -> feature-x).
      - name: Compute artifact name
        id: meta
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "name=wein-debug-apk-${BRANCH//\//-}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
